name: Build Windows installer and Linux package

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v1.0.0"
        required: true
        default: "v1.0.0"

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build DeskOS
        run: python scripts/build.py

      - name: Smoke-test the frozen application
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          DESKOS_HOME: ${{ runner.temp }}\deskos-build-smoke
        run: |
          & ".\dist\DeskOS\DeskOS.exe" --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build setup executable
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "/DMyAppVersion=$version" ".\packaging\deskos.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = ".\dist\installer\DeskOS-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Installer was not created: $installer" }

      - name: Verify installed app and uninstaller
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $installer = (Resolve-Path ".\dist\installer\DeskOS-Setup-$version.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "DeskOS-install-smoke"
          $dataDir = Join-Path $env:RUNNER_TEMP "DeskOS-user-data"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          Set-Content -LiteralPath (Join-Path $dataDir "keep-after-uninstall.txt") -Value "preserve"
          $installLog = Join-Path $env:RUNNER_TEMP "DeskOS-installer.log"
          $process = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir", "/LOG=$installLog") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "DeskOS installer exited with code $($process.ExitCode)" }
          $exe = Join-Path $installDir "DeskOS.exe"
          $deadline = (Get-Date).AddSeconds(15)
          while (-not (Test-Path -LiteralPath $exe) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
          if (-not (Test-Path -LiteralPath $exe)) {
            if (Test-Path -LiteralPath $installLog) { Get-Content -LiteralPath $installLog }
            Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Force -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "DeskOS*" } | Select-Object -ExpandProperty FullName
            throw "Installed DeskOS.exe is missing"
          }
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path -LiteralPath $uninstaller)) { throw "DeskOS uninstaller is missing" }
          $env:DESKOS_HOME = $dataDir
          $env:QT_QPA_PLATFORM = "offscreen"
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Installed DeskOS self-test failed with code $LASTEXITCODE" }
          Get-Process -Name "DeskOS" -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Milliseconds 500
          $uninstallLog = Join-Path $env:RUNNER_TEMP "DeskOS-uninstaller.log"
          $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$uninstallLog") -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) { throw "DeskOS uninstaller exited with code $($uninstallProcess.ExitCode)" }
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path -LiteralPath $exe) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Milliseconds 250 }
          if (Test-Path -LiteralPath $exe) {
            if (Test-Path -LiteralPath $uninstallLog) { Get-Content -LiteralPath $uninstallLog }
            Get-ChildItem -LiteralPath $installDir -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            throw "DeskOS application files remain after uninstall"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $dataDir "keep-after-uninstall.txt"))) {
            throw "Uninstall unexpectedly removed user data"
          }

      - name: Package Windows archive and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path ".\dist\DeskOS\*" -DestinationPath ".\DeskOS-windows-x64.zip" -Force
          New-Item -ItemType Directory -Force -Path ".\release" | Out-Null
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          Copy-Item ".\dist\installer\DeskOS-Setup-$version.exe" ".\release\"
          Copy-Item ".\DeskOS-windows-x64.zip" ".\release\"
          Get-ChildItem ".\release" -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath ".\release\SHA256SUMS.txt" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: DeskOS-Windows-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux executable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libegl1 libfontconfig1 \
            libfreetype6 libgl1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0"

      - name: Build
        run: python scripts/build.py

      - name: Smoke-test the frozen application
        env:
          QT_QPA_PLATFORM: offscreen
          DESKOS_HOME: /tmp/deskos-smoke
        run: ./dist/DeskOS/DeskOS --self-test

      - name: Package
        run: tar -czf DeskOS-linux-x64.tar.gz -C dist DeskOS

      - uses: actions/upload-artifact@v4
        with:
          name: DeskOS-linux-x64
          path: DeskOS-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: [windows, linux]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach installers and packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.0.0' }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "DeskOS $TAG" \
              --notes "Windows setup installer and portable archive, plus the Linux archive. The Windows installer is built with Inno Setup and smoke-tested after installation; the uninstaller is also checked to preserve the user data directory."
          gh release upload "$TAG" artifacts/DeskOS-Setup-*.exe artifacts/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
