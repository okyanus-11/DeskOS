name: Build executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0"

      - name: Build DeskOS.exe
        run: python scripts/build.py

      - name: Smoke-test the frozen application
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          DESKOS_HOME: ${{ runner.temp }}\deskos-smoke
        run: |
          & "dist\DeskOS\DeskOS.exe" --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "dist\DeskOS\*" -DestinationPath "DeskOS-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: DeskOS-windows-x64
          path: DeskOS-windows-x64.zip
          if-no-files-found: error

  linux:
    name: Linux executable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libegl1 libfontconfig1 \
            libfreetype6 libgl1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0"

      - name: Build
        run: python scripts/build.py

      - name: Smoke-test the frozen application
        env:
          QT_QPA_PLATFORM: offscreen
          DESKOS_HOME: /tmp/deskos-smoke
        run: ./dist/DeskOS/DeskOS --self-test

      - name: Package
        run: tar -czf DeskOS-linux-x64.tar.gz -C dist DeskOS

      - uses: actions/upload-artifact@v4
        with:
          name: DeskOS-linux-x64
          path: DeskOS-linux-x64.tar.gz
          if-no-files-found: error
